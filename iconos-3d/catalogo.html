<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iconos 3D · EONLINK</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf0f0;background:#0a0c0e}*{box-sizing:border-box}body{margin:0;padding:40px clamp(20px,5vw,70px)}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;margin:0 0 6px}p{color:#9ca7aa;line-height:1.5;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.card{background:#15191b;border:1px solid #2a3034;border-radius:18px;padding:18px;min-height:225px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px}.card img{width:145px;height:145px;object-fit:contain}.card span{font-size:13px;font-weight:600;text-align:center}.card small{font-size:10px;color:#879295}.card:hover{background:#20262a;border-color:#576265}a{color:inherit;text-decoration:none}
</style>
<h1>Iconos 3D para EONLINK</h1><p>20 recursos PNG transparentes · abre cualquier tarjeta para ver el archivo en resolución completa.</p><div class="grid" id="grid"></div>
<script>
const names=['Resumen','Obras','Archivos','Cotizaciones','Asistente','Movimientos','Caja chica','Gastos','Cuentas','Pendientes','Nueva obra','Crear cotización','Registrar gasto','Comprobantes','Precios','Dinero asignado','Autorizar cotización','Avance de obra','Revisar movimiento','Asistente de precios'];
const files=['resumen','obras','archivos','cotizaciones','asistente','movimientos','caja-chica','gastos','cuentas','pendientes','nueva-obra','crear-cotizacion','registrar-gasto','comprobantes','precios','dinero-asignado','autorizar-cotizacion','avance-obra','revisar-movimiento','asistente-precios'];
document.getElementById('grid').innerHTML=names.map((name,i)=>`<a class="card" href="${files[i]}.png" target="_blank"><img src="${files[i]}.png" alt=""><span>${name}</span><small>${files[i]}.png</small></a>`).join('');
</script></html>
